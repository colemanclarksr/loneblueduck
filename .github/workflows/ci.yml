name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch supersedes an in-flight run, so a PR's status
# always reflects its latest commit rather than whichever run finished last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Absolute, because the Prisma CLI and the Next server resolve a relative
      # file: URL against different working directories and would otherwise open
      # two different SQLite files.
      DATABASE_URL: file:${{ github.workspace }}/prisma/dev.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The generated Prisma client is gitignored, so it has to be built before
      # anything that imports it.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
